name: Daily Paper Trade

on:
  schedule:
    - cron: '0 8 * * 1-5'  # 毎週月〜金 17:00 JST（東証終値確定後）
  workflow_dispatch:         # GitHub画面から手動実行も可能

jobs:
  trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p trading/data

      - name: Run daily paper trade
        run: python run_daily.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Update Google Sheets
        run: python report/sheets_reporter.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}

      - name: Save portfolio data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trading/data/
          git diff --staged --quiet || git commit -m "chore: update portfolio $(date +'%Y-%m-%d')"
          git push
